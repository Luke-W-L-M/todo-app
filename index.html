<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Todo</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Add a task…" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
    <p id="empty-message">No tasks yet.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
